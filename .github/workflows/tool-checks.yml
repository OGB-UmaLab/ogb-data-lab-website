name: Website tool checks
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'guides/**'
      - 'tests/**'
      - '.github/workflows/tool-checks.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'guides/**'
      - 'tests/**'
      - '.github/workflows/tool-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run website tool tests
        run: node --test tests/site-tools.test.cjs
